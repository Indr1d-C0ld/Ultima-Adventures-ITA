# Discord bridge config
# Set enabled=true after filling values
enabled=false
# Legacy network transport settings retained for compatibility; shard now uses local queue folders.
bot_token=
# Legacy single command channel id (still supported):
command_channel_id=
# Preferred multi-channel command config (worker consumes these):
# command_channel_<n>_id = Discord channel id
# command_channel_<n>_staff = true for staff command channels, false for user command channels
command_channel_1_id=
command_channel_1_staff=true
command_channel_1_webhook_url=
command_channel_2_id=
command_channel_2_staff=false
command_channel_2_webhook_url=
command_channel_3_id=
command_channel_3_staff=false
command_channel_3_webhook_url=
# Legacy output webhook values (external worker can still use these)
event_webhook_url=
# Optional: dedicated webhook for player lifecycle events (join/leave/death/new character)
player_event_webhook_url=
# Optional: dedicated webhook for player chat relay
chat_webhook_url=
# Optional: command replies to a separate webhook/channel
command_webhook_url=
command_prefix=!uo
# Comma-separated Discord user IDs allowed for save/reset/restart
staff_user_ids=
# Legacy keys still supported: listen_channel_id, notify_webhook_url
